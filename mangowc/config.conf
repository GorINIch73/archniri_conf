# MangoWC experiment profile. Link this directory to ~/.config/mango.
# Monitor-specific settings live in local.conf.

source=./appearance.conf
source=./input.conf
source=./bindings.conf
source_optional=./local.conf

# Match the existing Niri input layout and shortcuts where possible.
xkb_rules_layout=us,ru
xkb_rules_options=grp:win_space_toggle,compose:ralt,ctrl:nocaps
repeat_rate=30
repeat_delay=250

# Mango's key names use SUPER for the Mod key in the current Niri profile.
exec_once=noctalia --daemon
exec_once=mako
exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store
exec_once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec_once=swayidle -w timeout 600 'swaylock -f'
