# Pastel anime-inspired base colors; Noctalia handles the dynamic wallpaper palette.
root_color=0x171522ff
border_px=2
border_color=0x48415fff
focus_color=0xf3a6d8ff
maximizescreencolor=0xf3a6d8ff
urgent_color=0xff6b8aff
drop_color=0xf3a6d855
split_color=0x9b8cffcc

gap_inner_horizontal=10
gap_inner_vertical=10
gap_outer_horizontal=18
gap_outer_vertical=18

# Frosted glass. Keep optimized wallpaper-backed blur enabled for lower GPU cost.
blur=1
blur_layer=1
blur_optimized=1
blur_params_radius=6
blur_params_num_passes=2
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.15

shadows=1
shadow_only_floating=1
shadows_size=10
shadows_blur=18
shadows_position_x=0
shadows_position_y=5
shadows_color=0x08061188

border_radius=12
focused_opacity=1.0
unfocused_opacity=0.96

circle_layout=dwindle,scroller,tile,center_tile,grid
# Keep the existing master window in master-stack layouts; new clients join the stack.
new_is_master=0
dwindle_split_ratio=0.52
dwindle_smart_split=1
# Match Niri: half-width columns, center only when focus would be off-screen.
scroller_default_proportion=0.5
scroller_prefer_overspread=0
scroller_focus_center=0
scroller_prefer_center=1
# Keep horizontal Scroller movement animated without making transitions too slow.
animation_duration_move=250
