# Applications and shell panels
bind=SUPER,Return,spawn,kitty
bind=SUPER,D,spawn,noctalia msg panel-toggle launcher
bind=SUPER,B,spawn,firefox
bind=SUPER+SHIFT,B,spawn,google-chrome-stable
bind=SUPER+SHIFT,D,spawn,discord-stable
bind=SUPER,P,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,S,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle
bind=SUPER+SHIFT,E,spawn,wlogout
bind=SUPER+ALT,L,spawn,swaylock

# Niri-like focus and window movement: HJKL plus arrow keys.
bind=SUPER,H,focusdir,left
bind=SUPER,J,focusdir,down
bind=SUPER,K,focusdir,up
bind=SUPER,L,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER+CTRL,H,move_client,left
bind=SUPER+CTRL,J,move_client,down
bind=SUPER+CTRL,K,move_client,up
bind=SUPER+CTRL,L,move_client,right
bind=SUPER+CTRL,Left,move_client,left
bind=SUPER+CTRL,Down,move_client,down
bind=SUPER+CTRL,Up,move_client,up
bind=SUPER+CTRL,Right,move_client,right

# Tags/workspaces. Mango uses nine numbered tags rather than Niri workspaces.
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER,Page_Down,viewtoleft
bind=SUPER,Page_Up,viewtoright
bind=SUPER,Up,viewtoleft
bind=SUPER,Down,viewtoright
bind=SUPER+SHIFT,Page_Down,tagtoleft
bind=SUPER+SHIFT,Page_Up,tagtoright

# Layout, overview, and window state
bind=SUPER,Q,killclient
bind=SUPER,O,toggleoverview
bind=SUPER,V,togglefloating
bind=SUPER,F,togglemaximizescreen
bind=SUPER+SHIFT,F,togglefullscreen
bind=SUPER,N,switch_layout
bind=SUPER,R,zoom
bind=SUPER+SHIFT,R,reload_config
bind=SUPER+SHIFT,Q,quit

# Route wallpaper changes through Noctalia so its palette stays synchronized.
bind=SUPER,T,spawn_shell,~/.config/mango/scripts/next-wallpaper

# Media and hardware keys
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+ -l 1.0
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +10%
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 10%-

# Screenshots
bind=NONE,Print,spawn_shell,mkdir -p "$HOME/Pictures/Screenshots"; grim "$HOME/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png"
bind=SHIFT,Print,spawn_shell,grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
