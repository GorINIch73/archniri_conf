# Keep the familiar Ctrl-b prefix. Most commands use prefix, then a key.
set -g prefix C-b
bind C-b send-prefix

# Start windows and panes in the current working directory.
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Convenient pane navigation and a larger scrollback history.
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g renumber-windows on
setw -g mode-keys vi

# Reload this file with prefix, then r.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
