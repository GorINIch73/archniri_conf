# Shared, hardware-independent Hyprland session.
# Add monitor-specific rules here or keep them in an untracked local file.
monitor = , preferred, auto, 1

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita

input {
    kb_layout = us,ru
    kb_options = grp:win_space_toggle,compose:ralt,ctrl:nocaps
    numlock_by_default = true

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 7
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(cba6f7ff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(585b70ff)
    layout = dwindle
}

decoration {
    rounding = 16
    active_opacity = 1.0
    inactive_opacity = 0.96
    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000088)
    }
    blur {
        enabled = true
        size = 8
        passes = 2
    }
}

animations {
    enabled = true
    animation = windows, 1, 4, default
    animation = workspaces, 1, 4, default
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar -c ~/.config/waybar/config.hyprland.jsonc
exec-once = mako
exec-once = awww-daemon
exec-once = nm-applet
exec-once = swayidle -w timeout 600 'swaylock -f'
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

$mod = SUPER
bind = $mod, Return, exec, kitty
bind = $mod, D, exec, fuzzel
bind = $mod, B, exec, firefox
bind = $mod SHIFT, B, exec, google-chrome-stable
bind = $mod SHIFT, D, exec, discord-stable
bind = $mod, T, exec, ~/.local/bin/next-wallpaper
bind = $mod SHIFT, T, exec, ~/.local/bin/theme-menu
bind = $mod, P, exec, ~/.local/bin/clipboard-picker
bind = $mod SHIFT, E, exec, wlogout
bind = SUPER ALT, L, exec, swaylock

bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 1
bind = $mod SHIFT, F, fullscreen, 0
bind = $mod, V, togglefloating
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod CTRL, H, movewindow, l
bind = $mod CTRL, J, movewindow, d
bind = $mod CTRL, K, movewindow, u
bind = $mod CTRL, L, movewindow, r

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+ -l 1.0
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, ~/.local/bin/toggle-microphone
bindl = , Pause, exec, ~/.local/bin/toggle-microphone
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

bind = , Print, exec, ~/.local/bin/screenshot full
bind = SHIFT, Print, exec, ~/.local/bin/screenshot area
bind = CTRL, Print, exec, ~/.local/bin/screenshot copy-area
